<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fb;
      color: #1a1a2e;
    }
    .header {
      background: linear-gradient(135deg, #4fc3f7 0%, #7c3aed 100%);
      color: white;
      padding: 14px 16px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header svg { width: 18px; height: 18px; }
    .body { padding: 16px; }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus { border-color: #7c3aed; }
    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #4fc3f7, #7c3aed);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      font-size: 12px;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      display: none;
    }
    .status.success { display: block; background: #d1fae5; color: #065f46; }
    .status.error { display: block; background: #fee2e2; color: #991b1b; }
    .settings {
      border-top: 1px solid #e5e7eb;
      padding-top: 12px;
      margin-top: 4px;
    }
    .settings label { margin-bottom: 4px; }
    .save-btn {
      background: #f3f4f6;
      color: #374151;
      font-size: 12px;
      padding: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    Octoflash
  </div>
  <div class="body">
    <label>YouTube URL</label>
    <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=...">
    <button id="queueBtn">Queue Video</button>
    <div class="status" id="status"></div>

    <div class="settings">
      <label>API URL</label>
      <input type="text" id="apiUrl" placeholder="http://localhost:8000">
      <button class="save-btn" id="saveBtn">Save Settings</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
